{% extends "estoque_app/base.html" %}

{% block title %}Movimentar Estoque{% endblock %}

{% block content %}
        <header class="page-header">
            <div class="page-header-text">
                <h1>Movimentar Estoque</h1>
                <p class="page-subtitle">
                    Produto: <strong>{{ produto.nome }}</strong> —
                    Estoque atual: <strong>{{ produto.estoque }}</strong>
                </p>
            </div>
        </header>

        {% if erro %}
            <p class="alerta-erro">{{ erro }}</p>
        {% endif %}

        <div class="card">
            <form method="POST" class="form-container">
                {% csrf_token %}

                <div class="form-group">
                    <label>Tipo de movimentação</label>
                    <select name="tipo" required>
                        <option value="">-- Selecione --</option>
                        <option value="entrada">Entrada</option>
                        <option value="saida">Saída</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Quantidade</label>
                    <input type="number" name="quantidade" min="1" required placeholder="Ex: 5">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Registrar movimentação</button>
                    <a href="{% url 'produtos' %}" class="btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
{% endblock %}
