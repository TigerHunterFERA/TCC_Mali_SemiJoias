{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Produto</title>
    <link rel="stylesheet" href="{% static 'estoque_app/style.css' %}">
</head>
<body>
    <!-- Sidebar fixa -->
    <nav class="sidebar">
        <h2>MALI</h2>
        <a href="{% url 'dashboard' %}">📊 Dashboard</a>
        <a href="{% url 'produtos' %}">💍 Estoque</a>
        <a href="#">⚙️ Configurações</a>
    </nav>

    <!-- Área principal -->
    <main class="main-content">
        <header>
            <h1>Adicionar Novo Produto</h1>
        </header>

        <!-- Card estilizado -->
        <div class="card">
            <form method="POST" class="form-container">
                {% csrf_token %}
                <label>Nome do Produto</label>
                <input type="text" name="nome" required>
                <br>

                <label>Tipo do Produto</label>
                <input type="text" name="tipo" placeholder="Ex: anel, colar...">
                <br>

                <label>Categoria</label>
                <input type="text" name="categoria">
                <br>

                <label>Banho</label>
                <select name="banho">
                    <option value="">-- Selecione --</option>
                    {% for tipo in tipos_banho %}
                    <option value="{{ tipo.id }}">{{ tipo.nome }}</option>
                    {% endfor %}
                </select>
                <br>

                <label>Novo tipo de banho</label>
                <input type="text" name="novo_banho" placeholder="Ex: Ouro, Prata... (opcional)">
                <br>

                <label>Peso (g)</label>
                <input type="number" name="peso" step="0.01" min="0" placeholder="Ex: 2.50">
                <br>

                <label>Preço (R$)</label>
                <input type="number" step="0.01" name="preco" value="0">
                <br>

                <label>Estoque</label>
                <input type="number" name="quantidade" value="0">
                <br>

                <label>URL da Imagem</label>
                <input type="url" name="imagem" placeholder="https://...">
                <br>

                <label>Descrição</label>
                <textarea name="descricao"></textarea>
                <br>

                <button type="submit" class="btn-mali">Adicionar Produto</button>
                <a href="{% url 'produtos' %}" class="btn-mali" style="background:#ccc; color:#333;">Cancelar</a>
            </form>
        </div>
    </main>
</body>
</html>
