{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Produto</title>
    <link rel="stylesheet" href="{% static 'estoque_app/style.css' %}">
</head>
<body>
    <!-- Sidebar fixa -->
    <nav class="sidebar">
        <h2>MALI</h2>
        <a href="{% url 'dashboard' %}">📊 Dashboard</a>
        <a href="{% url 'produtos' %}">💍 Estoque</a>
        <a href="#">⚙️ Configurações</a>
    </nav>

    <!-- Área principal -->
    <main class="main-content">
        <header>
            <h1>Adicionar Novo Produto</h1>
        </header>

        {% if erro %}
            <p style="color: red; font-weight: bold;">
                {{ erro }}
            </p>
        {% endif %}

        <!-- Card estilizado -->
        <div class="card">
            <form method="POST" class="form-container">
                {% csrf_token %}
                <label>Nome do Produto</label>
                <input type="text" name="nome" required>
                <br>

                <label>Tipo do Produto</label>
                <input type="text" name="tipo" placeholder="Ex: anel, colar...">
                <br>

                <label>Categoria</label>
                <input type="text" name="categoria">
                <br>

                <label>Banho</label>

                <div class="banho-wrapper">
                    <select name="banho" id="banho-select">
                        <option value="">-- Selecione --</option>
                
                        {% for tipo in tipos_banho %}
                            <option value="{{ tipo.id }}">{{ tipo.nome }}</option>
                        {% endfor %}            
                
                        <option value="__novo__">＋ Novo tipo de banho</option>
                    </select>
                
                    <div id="novo-banho-container" class="novo-banho-container">
                        <span>Digite um novo banho</span>
                
                        <input
                            type="text"
                            name="novo_banho"
                            id="novo-banho-input"
                            placeholder="Ex: Ródio Branco"
                        >
                    </div>
                </div>
                <br>

                <label>Peso (g)</label>
                <input type="number" name="peso" step="0.01" min="0" placeholder="Ex: 2.50">
                <br>

                <label>Preço (R$)</label>
                <input type="number" step="0.01" min="0" name="preco" required>
                <br>

                <label>Estoque</label>
                <input type="number" min="0" name="quantidade" required>
                <br>

                <label>Descrição</label>
                <textarea name="descricao"></textarea>
                <br>

                <button type="submit" class="btn-mali">Adicionar Produto</button>
                <a href="{% url 'produtos' %}" class="btn-mali" style="background:#ccc; color:#333;">Cancelar</a>
            </form>
        </div>
    </main>
    <script>
        const banhoSelect = document.getElementById("banho-select");
        const novoBanhoContainer = document.getElementById("novo-banho-container");
        const novoBanhoInput = document.getElementById("novo-banho-input");
    
        banhoSelect.addEventListener("change", function () {
            if (this.value === "__novo__") {
                novoBanhoContainer.style.display = "flex";
                novoBanhoInput.required = true;
                novoBanhoInput.focus();
            } else {
                novoBanhoContainer.style.display = "none";
                novoBanhoInput.required = false;
                novoBanhoInput.value = "";
            }
        });
    </script>
</body>
</html>
