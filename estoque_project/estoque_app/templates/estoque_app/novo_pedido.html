{% extends "estoque_app/base.html" %}

{% block title %}Mali Semijoias - Novo Pedido{% endblock %}

{% block content %}
        <header class="page-header">
            <div class="page-header-text">
                <h1>Novo Pedido</h1>
                <p class="page-subtitle">Selecione o cliente para criar o pedido</p>
            </div>
        </header>

        <div class="card">
            {% if erro %}
                <p class="alerta-erro">{{ erro }}</p>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label for="usuario">Cliente</label>
                    <select name="usuario" id="usuario" required>
                        <option value="">Selecione um cliente</option>
                        {% for cliente in clientes %}
                            <option value="{{ cliente.id }}">{{ cliente.nome }} ({{ cliente.email }})</option>
                        {% empty %}
                            <option value="" disabled>Nenhum cliente cadastrado</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Criar Pedido</button>
                    <a href="{% url 'pedidos' %}" class="btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
{% endblock %}
