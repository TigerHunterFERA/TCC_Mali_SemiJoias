{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto</title>
    <link rel="stylesheet" href="{% static 'estoque_app/style.css' %}">
</head>
<body>
    <!-- Sidebar fixa -->
    <nav class="sidebar">
        <h2>MALI</h2>
        <a href="{% url 'dashboard' %}">📊 Dashboard</a>
        <a href="{% url 'produtos' %}">💍 Estoque</a>
    </nav>

    <!-- Área principal -->
    <main class="main-content">
        <header>
            <h1>Editar Produto</h1>
        </header>

        {% if erro %}
            <p style="color: red; font-weight: bold;">
                {{ erro }}
            </p>
        {% endif %}

        <!-- Card estilizado -->
        <div class="card">
            <form method="POST" class="form-container editar-produto-form">
                {% csrf_token %}

                <div class="form-group">
                    <label>Nome do Produto</label>
                    <input type="text" name="nome" value="{{ produto.nome }}" required>
                </div>

                <div class="form-group">
                    <label>Tipo do Produto</label>
                    <input type="text" name="tipo" value="{{ produto.tipo }}" placeholder="Ex: anel, colar...">
                </div>

                <div class="form-group">
                    <label>Categoria</label>
                    <input type="text" name="categoria" value="{{ produto.categoria }}">
                </div>

                <div class="form-group">
                    <label>Banho</label>
                    <div class="banho-wrapper">
                        <select name="banho" id="banho-select">
                            <option value="">-- Selecione --</option>

                            {% for tipo in tipos_banho %}
                                <option
                                    value="{{ tipo.id }}"
                                    {% if produto.banho_id == tipo.id %}selected{% endif %}
                                >
                                    {{ tipo.nome }}
                                </option>
                            {% endfor %}

                            <option value="__novo__">＋ Novo tipo de banho</option>
                        </select>

                        <div id="novo-banho-container" class="novo-banho-container">
                            <span>Digite um novo banho</span>

                            <input
                                type="text"
                                name="novo_banho"
                                id="novo-banho-input"
                                placeholder="Ex: Ródio Branco"
                            >
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Peso (g)</label>
                    <input type="number" name="peso" step="0.01" min="0" value="{{ produto.peso }}" placeholder="Ex: 2.50">
                </div>

                <div class="form-group">
                    <label>Preço (R$)</label>
                    <input type="number" step="0.01" min="0" name="preco" value="{{ produto.preco }}" required>
                </div>

                <!-- Bloco 1: estoque somente leitura + movimentação -->
                <div class="estoque-edicao">
                    <div class="form-group">
                        <label>Estoque atual</label>
                        <input
                            type="number"
                            value="{{ produto.estoque }}"
                            readonly
                        >
                    </div>

                    <p class="estoque-edicao-ajuda">
                        Para alterar o estoque, utilize a opção "Movimentar estoque".
                    </p>

                    <a href="{% url 'movimentar' produto.id %}" class="btn-mali estoque-edicao-movimentar">
                        📦 Movimentar estoque
                    </a>
                </div>

                <!-- Bloco 2: descrição -->
                <div class="form-group estoque-edicao-descricao">
                    <label>Descrição</label>
                    <textarea name="descricao">{{ produto.descricao }}</textarea>
                </div>

                <!-- Bloco 3: ações finais -->
                <div class="form-actions estoque-edicao-botoes">
                    <button type="submit" class="btn-mali">Salvar Alterações</button>
                    <a href="{% url 'produtos' %}" class="btn-mali estoque-edicao-cancelar">Cancelar</a>
                </div>
            </form>

            {% if mensagem %}
                <p class="erro">{{ mensagem }}</p>
            {% endif %}
        </div>
    </main>
    <script>
        const banhoSelect = document.getElementById("banho-select");
        const novoBanhoContainer = document.getElementById("novo-banho-container");
        const novoBanhoInput = document.getElementById("novo-banho-input");
    
        banhoSelect.addEventListener("change", function () {
            if (this.value === "__novo__") {
                novoBanhoContainer.style.display = "block";
                novoBanhoInput.required = true;
                novoBanhoInput.focus();
            } else {
                novoBanhoContainer.style.display = "none";
                novoBanhoInput.required = false;
                novoBanhoInput.value = "";
            }
        });
    </script>
</body>
</html>
