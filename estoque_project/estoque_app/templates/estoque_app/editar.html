{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto</title>
    <link rel="stylesheet" href="{% static 'estoque_app/style.css' %}">
</head>
<body>
    <!-- Sidebar fixa -->
    <nav class="sidebar">
        <h2>MALI</h2>
        <a href="{% url 'dashboard' %}">📊 Dashboard</a>
        <a href="{% url 'produtos' %}">💍 Estoque</a>
    </nav>

    <!-- Área principal -->
    <main class="main-content">
        <header>
            <h1>Editar Produto</h1>
        </header>

        {% if erro %}
            <p style="color: red; font-weight: bold;">
                {{ erro }}
            </p>
        {% endif %}

        <!-- Card estilizado -->
        <div class="card">
            <form method="POST" class="form-container">
                {% csrf_token %}

                <label>Nome do Produto</label>
                <input type="text" name="nome" value="{{ produto.nome }}" required><br>

                <label>Tipo do Produto</label>
                <input type="text" name="tipo" value="{{ produto.tipo }}" placeholder="Ex: anel, colar..."><br>

                <label>Categoria</label>
                <input type="text" name="categoria" value="{{ produto.categoria }}"><br>

                <label>Banho</label>
                <select name="banho">
                    <option value="">-- Selecione --</option>
                    {% for tipo in tipos_banho %}
                    <option value="{{ tipo.id }}" {% if produto.banho_id == tipo.id %}selected{% endif %}>{{ tipo.nome }}</option>
                    {% endfor %}
                </select><br>

                <label>Novo tipo de banho</label>
                <input type="text" name="novo_banho" placeholder="Ex: Ouro, Prata... (opcional)"><br>

                <label>Peso (g)</label>
                <input type="number" name="peso" step="0.01" min="0" value="{{ produto.peso }}" placeholder="Ex: 2.50"><br>

                <label>Preço (R$)</label>
                <input type="number" step="0.01" min="0" name="preco" value="{{ produto.preco }}" required><br>

                <label>Estoque</label>
                <input type="number" min="0" name="quantidade" value="{{ produto.estoque }}" required><br>

                <label>URL da Imagem</label>
                <input type="url" name="imagem" value="{{ produto.imagem }}" placeholder="https://..."><br>
                <label>Descrição</label>
                <textarea name="descricao">{{ produto.descricao }}</textarea><br>

                <button type="submit" class="btn-mali">Salvar Alterações</button>
                <a href="{% url 'produtos' %}" class="btn-mali" style="background:#ccc; color:#333;">Cancelar</a>
            </form>

            {% if mensagem %}
                <p class="erro">{{ mensagem }}</p>
            {% endif %}
        </div>
    </main>
</body>
</html>
